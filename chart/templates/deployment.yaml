apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pcsx2.fullname" . }}
  labels:
    {{- include "pcsx2.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pcsx2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pcsx2.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if and .Values.sunshine.enabled .Values.sunshine.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pcsx2.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.securityContext .Values.seccompUnconfined (and .Values.sunshine.enabled .Values.sunshine.privileged) }}
          securityContext:
            {{- with .Values.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.seccompUnconfined }}
            seccompProfile:
              type: Unconfined
            {{- end }}
            {{- if and .Values.sunshine.enabled .Values.sunshine.privileged }}
            privileged: true
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.service.httpsPort }}
              protocol: TCP
            {{- if .Values.streaming.enabled }}
            - name: broker
              containerPort: {{ .Values.streaming.brokerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.sunshine.enabled }}
            - name: sun-web
              containerPort: {{ add .Values.sunshine.port 1 }}
              protocol: TCP
            - name: sun-http
              containerPort: {{ .Values.sunshine.port }}
              protocol: TCP
            - name: sun-https
              containerPort: {{ sub .Values.sunshine.port 5 }}
              protocol: TCP
            - name: sun-rtsp
              containerPort: {{ add .Values.sunshine.port 21 }}
              protocol: TCP
            - name: sun-video
              containerPort: {{ add .Values.sunshine.port 9 }}
              protocol: UDP
            - name: sun-control
              containerPort: {{ add .Values.sunshine.port 10 }}
              protocol: UDP
            - name: sun-audio
              containerPort: {{ add .Values.sunshine.port 11 }}
              protocol: UDP
            - name: sun-mic
              containerPort: {{ add .Values.sunshine.port 13 }}
              protocol: UDP
            {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if and .Values.gpu.enabled (eq .Values.gpu.vendor "nvidia") }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: {{ .Values.gpu.nvidia.driverCapabilities | quote }}
            {{- end }}
            {{- if .Values.sunshine.enabled }}
            - name: SUNSHINE_PORT
              value: {{ .Values.sunshine.port | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: shm
              mountPath: /dev/shm
            {{- if and .Values.gpu.enabled (eq .Values.gpu.vendor "intel-amd") }}
            - name: dri
              mountPath: {{ .Values.gpu.devicePath }}
            {{- end }}
            {{- if .Values.sunshine.enabled }}
            - name: uinput
              mountPath: /dev/uinput
            - name: uhid
              mountPath: /dev/uhid
            - name: dev-input
              mountPath: /dev/input
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.resources.limits | nindent 14 }}
              {{- if and .Values.gpu.enabled (eq .Values.gpu.vendor "nvidia") }}
              nvidia.com/gpu: {{ .Values.gpu.nvidia.count }}
              {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      {{- if and .Values.gpu.enabled (eq .Values.gpu.vendor "intel-amd") }}
      {{- with .Values.gpu.supplementalGroups }}
      securityContext:
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- end }}
      volumes:
        - name: config
          {{- if not .Values.persistence.config.enabled }}
          emptyDir: {}
          {{- else if eq .Values.persistence.config.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.existingClaim | default (printf "%s-config" (include "pcsx2.fullname" .)) }}
          {{- else if eq .Values.persistence.config.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.config.hostPath }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        {{- if and .Values.gpu.enabled (eq .Values.gpu.vendor "intel-amd") }}
        - name: dri
          hostPath:
            path: {{ .Values.gpu.devicePath }}
        {{- end }}
        {{- if .Values.sunshine.enabled }}
        - name: uinput
          hostPath:
            path: /dev/uinput
            type: CharDevice
        - name: uhid
          hostPath:
            path: /dev/uhid
            type: CharDevice
        - name: dev-input
          hostPath:
            path: /dev/input
            type: Directory
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
